[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minicu"
version = "0.2.0"
authors = [
    { name="Molnár Csaba" }
]
description = "Könnyűsúlyú OS-szintű GUI automatizációs ágens Gemini Flash Lite használatával."
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "PyAutoGUI",
    "Pillow",
    "plyer"
]

[project.scripts]
minicu = "minicu.minicu:main"